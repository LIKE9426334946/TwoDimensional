<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f6fa"><meta name="description" content="在二维坐标系中拖动输入向量，实时观察矩阵变换后的向量和运动轨迹。"><title>TwoDimensional · 二维矩阵变换</title><link rel="icon" href="/assets/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/assets/app.css"></head>
<body>
<header class="app-header"><a class="brand" href="/"><img src="/assets/icon.svg" width="34" height="34" alt=""><span>TwoDimensional<small>二维矩阵变换</small></span></a><div class="header-actions"><div id="connection" class="connection" data-mode="waiting" role="status"><i></i><span>正在连接</span></div><button class="button icon-button" type="button" data-clear-trails title="清空轨迹" aria-label="清空轨迹"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg></button><a class="button" href="/admin"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 3-.6 2.2-1.8 1L5.4 6 3.5 9.3 5 11v2l-1.5 1.7L5.4 18l2.2-.2 1.8 1L10 21h4l.6-2.2 1.8-1 2.2.2 1.9-3.3L19 13v-2l1.5-1.7L18.6 6l-2.2.2-1.8-1L14 3Z"/><circle cx="12" cy="12" r="3"/></svg>管理</a></div></header>
<main class="display-layout">
  <aside class="readout">
    <div class="page-intro"><span class="eyebrow">LINEAR TRANSFORMATION</span><h1>看见向量的变换</h1><p>每一次移动，都有一个对应的结果。</p></div>
    <section class="card matrix-readout" aria-labelledby="matrix-title">
      <div class="section-label"><h2 id="matrix-title">变换矩阵</h2><span class="math-letter">A</span></div>
      <div class="matrix-center"><div class="matrix-brackets matrix-values" aria-label="当前变换矩阵">
        <span data-coef="0,0">1</span><span data-coef="0,1">0.5</span><span data-coef="1,0">0</span><span data-coef="1,1">1</span>
      </div></div>
      <div class="matrix-foot"><span>det(A)</span><span id="det-value">1</span></div>
    </section>
    <section class="vector-readout-section" aria-labelledby="vector-title">
      <div class="section-label"><h2 id="vector-title">输入与输出</h2><span id="vector-count" class="count-badge">1</span></div>
      <div id="vector-readout" class="vector-readout"></div>
      <p id="empty-state" class="empty-state" hidden>还没有输入向量<br>前往管理页添加一个向量</p>
    </section>
    <div class="readout-footer"><div class="formula"><i>y</i><span>=</span><i>A</i><i>v</i></div><p>实线是输入，虚线是变换结果。<br>淡色曲线记录变换结果的移动轨迹。</p></div>
  </aside>
<section class="stage" aria-label="向量变换画布"><canvas id="plot"></canvas><div class="stage-top"><span class="stage-caption">二维坐标空间</span><div class="plot-legend"><span><i class="legend-line"></i>输入</span><span><i class="legend-line output-line"></i>变换结果</span></div></div><div id="overflow-note" class="overflow-note" hidden>有向量超出当前范围</div><div class="stage-hint"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 3 9 10-5 1-2 5-2-16Z"/></svg>拖住实心箭头移动</div><div class="coordinate-control"><label for="range">坐标范围</label><div class="range-field"><button id="range-minus" type="button" aria-label="缩小坐标范围" disabled>−</button><span aria-hidden="true">±</span><input id="range" type="text" inputmode="decimal" autocomplete="off" value="6" aria-label="坐标轴正负范围" disabled><button id="range-plus" type="button" aria-label="扩大坐标范围" disabled>+</button></div></div></section></main><div id="toast" class="toast" role="alert" hidden></div><script type="module" src="/js/display.mjs"></script>
</body></html>
